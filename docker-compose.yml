services:
  db:
    image: postgres:16-alpine
    container_name: unihr-db
    restart: always
    environment:
      POSTGRES_USER: unihr
      POSTGRES_PASSWORD: unihr
      POSTGRES_DB: unihr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unihr -d unihr"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: builder
    container_name: unihr-migrate
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://unihr:unihr@db:5432/unihr?schema=public&sslmode=disable
    restart: "no"

  app:
    build:
      context: .
      target: runner
    container_name: unihr-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://unihr:unihr@db:5432/unihr?schema=public&sslmode=disable
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - BIOMETRIC_API_KEY=${BIOMETRIC_API_KEY}

volumes:
  pgdata:
